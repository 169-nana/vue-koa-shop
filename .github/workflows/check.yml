name: TypeScript checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            my-shop/package-lock.json
            shop-system/package-lock.json
            KoaServer/package-lock.json
      - run: npm run setup
      - run: npm run check
      - run: npm run build
